# ~/.config/yazi/keymap.toml

[mgr]
prepend_keymap = [
  # Enter goes into directories and opens files.
  # Without this, Enter on a directory sends it to the editor.
  # Requires: ya pkg add yazi-rs/plugins:smart-enter
  { on = "<Enter>", run = "plugin smart-enter", desc = "Enter directory or open file" },

  { on = "y",     run = [ "yank", "plugin sysclip -- --action=copy" ], desc = "Copy (also to system clipboard)" },
  { on = "<C-v>", run = "plugin sysclip -- --action=paste", desc = "Paste from system clipboard" },
  { on = "W", run = 'shell --orphan -- ~/.config/yazi/scripts/yazi-open-with.sh %h', desc = "Open with (any app)" },

]
