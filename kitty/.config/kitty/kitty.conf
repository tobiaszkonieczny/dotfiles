# ~/.config/kitty/kitty.conf
# Reload without restarting: Ctrl+Shift+F5
# All options with descriptions: kitty +runpy "from kitty.config import *; print(commented_out_default_config())" | less

# ─── Fonts ───────────────────────────────────────────────
# Interactive font picker with preview: kitten choose-fonts
font_family      GeistMono Nerd Font
font_size        11.0
# disable_ligatures cursor        # break ligatures only under the cursor

# ─── Cursor (animated trail) ─────────────────────────────
cursor_shape                 beam
cursor_blink_interval        0
cursor_trail                 3
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 2

# ─── Performance / latency ───────────────────────────────
input_delay      0
repaint_delay    2
sync_to_monitor  no               # set to yes if you see tearing

# ─── Appearance ──────────────────────────────────────────
# Padding order: top right bottom left (like CSS)
window_padding_width        0 11 11 11
dynamic_background_opacity  yes   # Ctrl+Shift+A, then M/L to change opacity
confirm_os_window_close     0
remember_window_size        no

# ─── Tabs and layouts ────────────────────────────────────
enabled_layouts       splits,stack,tall
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   slanted
tab_title_template    "{index}: {title}"

# ─── Scrollback ──────────────────────────────────────────
scrollback_lines              10000
scrollback_pager_history_size 50

# ─── Mouse and clipboard ─────────────────────────────────
copy_on_select         clipboard
strip_trailing_spaces  smart
mouse_hide_wait        2.0
url_style              curly
detect_urls            yes

# ─── Bell ────────────────────────────────────────────────
enable_audio_bell     no
visual_bell_duration  0

# ─── Integrations ────────────────────────────────────────
shell_integration     enabled
allow_remote_control  socket-only
listen_on             unix:@kitty

# ─── Shortcuts ───────────────────────────────────────────
kitty_mod ctrl+shift

# Splits (splits layout), opened in the current window's directory
map ctrl+alt+v  launch --location=vsplit --cwd=current
map ctrl+alt+s  launch --location=hsplit --cwd=current

# Move between splits, vim-style
map ctrl+alt+h  neighboring_window left
map ctrl+alt+j  neighboring_window down
map ctrl+alt+k  neighboring_window up
map ctrl+alt+l  neighboring_window right

# Zoom the current split to the full window and back
map kitty_mod+m  toggle_layout stack

# New tab in the current directory
map kitty_mod+t  new_tab_with_cwd

# ─── Theme (generated by Noctalia) ───────────────────────
include themes/noctalia.conf
