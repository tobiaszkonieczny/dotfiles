config_version = 2

[bar.default]
background_opacity = 0.84999998100101948

[control_center.calendar]
show_events_card = false

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001", "desktop-widget-0000000000000002" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 259.20001220703125
    cy = 178.5
    output = "DP-1"
    rotation = 0.0
    type = "clock"

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 304.0
    box_width = 592.0
    cx = 2200.0
    cy = 1114.0
    output = "DP-1"
    rotation = 0.0
    type = "media_player"

[hooks]
wallpaper_changed = "/home/tobia/dotfiles/waypaper/changewall-noctalia.sh"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 1280.0
    cy = 1321.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

[shell]
corner_radius_scale = 0.65000000968575478
font_family = "Geist"
panel_anchor_bar = "default"

    [shell.panel]
    clipboard_position = "top_left"
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "foot", "hyprland" ]
    community_ids = [ "zen-browser", "obsidian", "vscode", "zed", "discord", "yazi", "hyprtoolkit" ]

[wallpaper]
directory = "/home/tobia/Pictures/wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/tobia/Pictures/wallpapers/bebop.jpg"

    [wallpaper.last]
    path = "/home/tobia/Pictures/wallpapers/bebop.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/tobia/Pictures/wallpapers/bebop.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/tobia/Pictures/wallpapers/bebop.jpg"