[notification]
background_opacity = 0.89999997988343239
offset_x = 30
offset_y = 20

[shell]
app_icon_color = "on_secondary"
font_family = "Geist"
panel_anchor_bar = "default"

    [shell.launcher.providers.calculator]
    prefix = ""

    [shell.panel]
    open_near_click_clipboard = true
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "cava", "foot", "gtk3", "gtk4", "hyprland" ]
    community_ids = [ "zen-browser", "discord", "obsidian", "vscode", "zed", "steam", "hyprtoolkit", "papirus-icons", "yazi" ]

[wallpaper]
directory = "/home/tobia/Pictures/wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/tobia/Pictures/wallpapers/bebop.jpg"

    [wallpaper.last]
    path = "/home/tobia/Pictures/wallpapers/bebop.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/tobia/Pictures/wallpapers/bebop.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/tobia/Pictures/wallpapers/bebop.jpg"

[widget.audio_visualizer]
width = 97

[widget.media]
enable_scroll = false
max_length = 123