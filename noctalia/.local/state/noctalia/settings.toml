config_version = 2

[bar.default]
background_opacity = 0.84999998100101948
font_family = "Geist"

[control_center.calendar]
show_events_card = false

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[hooks]
wallpaper_changed = "/home/tobia/dotfiles/waypaper/changewall-noctalia.sh"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@DP-1",
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002",
    "lockscreen-widget-0000000000000003",
    "lockscreen-widget-0000000000000004",
    "lockscreen-widget-0000000000000005",
    "lockscreen-widget-0000000000000006"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 1280.0
    cy = 1357.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface"
        background_opacity = 0.65000000000000002
        background_radius = 12.0
        center_password_text = false
        input_opacity = 0.80000000000000004
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = false

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 256.0
    box_width = 576.0
    cx = 1280.0
    cy = 336.0
    output = "DP-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background_opacity = 0.0
        clock_style = "digital"
        shadow = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 176.0
    box_width = 448.0
    cx = 368.0
    cy = 792.0
    output = "DP-1"
    rotation = 0.0
    type = "audio_visualizer"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        bands = 8
        show_when_idle = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000003]
    box_height = 144.0
    box_width = 448.0
    cx = 368.0
    cy = 616.0
    output = "DP-1"
    rotation = 0.0
    type = "volume"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000004]
    box_height = 176.0
    box_width = 448.0
    cx = 320.0
    cy = 708.0
    output = "eDP-1"
    rotation = 0.0
    type = "audio_visualizer"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000004.settings]
        bands = 8
        show_when_idle = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000005]
    box_height = 144.0
    box_width = 448.0
    cx = 320.0
    cy = 524.0
    output = "eDP-1"
    rotation = 0.0
    type = "volume"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000006]
    box_height = 256.0
    box_width = 576.0
    cx = 960.0
    cy = 252.0
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000006.settings]
        background_opacity = 0.0
        clock_style = "digital"
        shadow = false

[notification]
background_opacity = 0.89999997988343239
offset_x = 30
offset_y = 20

[shell]
app_icon_color = "on_secondary"
font_family = "Geist"
panel_anchor_bar = "default"

    [shell.launcher.providers.calculator]
    prefix = ""

    [shell.panel]
    open_near_click_clipboard = true
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "foot", "hyprland" ]
    community_ids = [ "zen-browser", "obsidian", "vscode", "zed", "discord", "yazi", "hyprtoolkit" ]

[wallpaper]
directory = "/home/tobia/Pictures/wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/tobia/Pictures/wallpapers/ur-name-3.jpg"

    [wallpaper.last]
    path = "/home/tobia/Pictures/wallpapers/ur-name-3.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/tobia/Pictures/wallpapers/ur-name-3.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/tobia/Pictures/wallpapers/ur-name-3.jpg"