    box_width = 1936.0
    cx = 960.0
    cy = 888.0
    output = "eDP-1"
    rotation = 0.0
    type = "audio_visualizer"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000004.settings]
        background = false
        bands = 64
        centered = false
